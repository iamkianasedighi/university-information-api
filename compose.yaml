services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: uni
      MYSQL_USER: uni_app
      MYSQL_PASSWORD: local_app_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./uni.sql:/docker-entrypoint-initdb.d/01-uni.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: uni_app
      DB_PASSWORD: local_app_password
      DB_NAME: uni
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
